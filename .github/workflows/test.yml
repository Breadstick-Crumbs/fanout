name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: node skills/fanout/check-plan.mjs examples/plan.md
      - name: Clash example must fail
        run: "! node skills/fanout/check-plan.mjs examples/plan-with-clash.md"
